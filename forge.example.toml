# Forge 3.0 — пример конфига. Скопируй в forge.toml и заполни свои значения.
# forge.toml в .gitignore — секреты и личные id не коммитятся. Почти всё правится в пульте
# («Настройки», «Склад», «Персонажи»); пульт переписывает forge.toml без комментариев —
# этот файл остаётся справочником.
#
# ВАЖНО про TOML: ключи верхнего уровня пишутся ДО первой [секции] — иначе попадут внутрь неё.

# Путь к локальной БД (относительно папки forge.toml или абсолютный).
db_path = "forge.db"

# --- Роли персонажей (вкладка «Персонажи»). Все списки пусты — участвуют все. ------------
manufacturing_character_ids = []   # производство
reaction_character_ids = []        # реакции
science_character_ids = []         # наука: инвента/копирование (пусто — те же, что на производстве)

# --- Где искать чертежи (location_id станций/структур; контейнеры внутри — тоже). --------
# Пусто — «свои» все чертежи. Выбор в пульте: «Настройки → Чертежи».
blueprint_location_ids = []

# --- «Всегда покупать» / «Всегда строить» (группы SDE и type_id). ---------------------------
always_buy_groups = []             # напр. [1136] — все Fuel Block
always_buy_types = []
always_build_groups = []           # строить, даже если рынок дешевле (если чертёж есть)
always_build_types = []

# --- Самоходные при вывозе (вывоз = топливо за прыжок, а не объём × ставка). ---------------
# По умолчанию: JF 902, карриер 547, дред 485, FAX 1538, супер 659, титан 30, Rorqual 883, BLOPS 898.
jump_capable_groups = [902, 547, 485, 1538, 659, 30, 883, 898]

# ---------------------------------------------------------------------------
# EVE SSO (OAuth2 PKCE). client_id — публичный идентификатор приложения с
# https://developers.eveonline.com/ . Секрет НЕ нужен (PKCE) и не хранится.
# refresh-токены — в Диспетчере учётных данных Windows, не в git и не в БД.
# callback_port должен совпадать с Callback URL приложения: http://localhost:<port>/callback
# Скоуп esi-universe.read_structures.v1 нужен, чтобы узнать имя и систему структур (склад).
# ---------------------------------------------------------------------------
[sso]
client_id = ""
callback_port = 8765

# ---------------------------------------------------------------------------
# Места логистики: хаб закупки (jita), рынок сбыта / 2-й хаб (c_j6mt), стройка (gplb_c).
# Имена идут в отчёты и подписи; *_id резолвятся из SDE по имени системы.
# ---------------------------------------------------------------------------
[locations.jita]
name = "Jita"
system_id = 30000142
region_id = 10000002

[locations.c_j6mt]
name = "C-J6MT"
system_id = 30000772
region_id = 0            # Insmother — резолвится из SDE

[locations.gplb_c]
name = "GPLB-C"
system_id = 0            # резолвится из SDE (Wicked Creek)
region_id = 0

# ---------------------------------------------------------------------------
# Игровые структуры (id — из игры).
# ---------------------------------------------------------------------------
[structures]
taj_mahgoon_market_id = 0          # рынок-структура по умолчанию (если market_structures пуст)
gplb_engineering_complex_id = 0    # EC места стройки (склад в режиме «auto»)
gplb_refinery_id = 0               # Refinery места стройки (склад в режиме «auto»)
# Рынки-структуры: ордера ВСЕХ сводятся в один срез рынка сбыта C-J6MT (min sell, max buy,
# суммарные объёмы); каждую тянет персонаж со скоупом esi-markets.structure_markets.v1 (сначала
# те, у кого там ассеты; 403 — следующий). Пусто — только taj_mahgoon_market_id.
market_structures = []

# ---------------------------------------------------------------------------
# Производство. Множители < 1 = экономия; доли: 0.01 = 1%. Это фолбэки — станции
# ([[facilities]]) с ригами важнее, если под роль джоба станция есть.
# ---------------------------------------------------------------------------
[industry]
rig_material_mult = 1.0
rig_cost_mult = 1.0
time_mult = 1.0
facility_tax = 0.0
scc_surcharge = 0.04
broker_fee = 0.0
sales_tax = 0.0
reprocessing_efficiency = 0.0      # 0 — не рассматривать переработку как альтернативу
# Шанс инвенты со скиллами инвентора: база × (1 + Encryption/40 + (наука1 + наука2)/30) ×
# декриптор (≤ 100%). Инвентор — лучший из пула «наука». false — «голый» шанс SDE, без скиллов.
invention_use_skills = true

# ---------------------------------------------------------------------------
# Инвента: выбор декриптора (и для обычной инвенты, и для недостачи ранов своей копии).
# decryptor_mode: "auto_cost" — минимум стоимости (по умолчанию) | "none" — без декриптора |
# "fixed" — всегда decryptor_type_id (0 — без). allowed_decryptors — кого перебирает авто
# (пусто — все 8: 34201 Accelerant, 34202 Attainment, 34203 Augmentation, 34204 Parity,
# 34205 Process, 34206 Symmetry, 34207 Optimized Attainment, 34208 Optimized Augmentation).
# per_product — декриптор для конкретного T2-товара (сильнее режима; 0 — без декриптора).
# Заданный декриптор без цены на рынке — фолбэк на авто с пометкой «Подготовка / проблемы».
# ---------------------------------------------------------------------------
[invention]
decryptor_mode = "auto_cost"
decryptor_type_id = 0
allowed_decryptors = []
# per_product = [{ type_id = 28846, decryptor_type_id = 34207 }]   # Nomad — Optimized Attainment

# ---------------------------------------------------------------------------
# Рынок: где покупать и как считать продажу.
# buy_hubs: "jita" (Jita + доставка) и/или "cj" (C-J6MT); пусто — оба.
# sell_price: "sell_min" (выставить ордер, по умолчанию) | "buy_max" (продать сразу в buy-ордер).
# ---------------------------------------------------------------------------
[market]
buy_hubs = ["jita", "cj"]
sell_price = "sell_min"

# ---------------------------------------------------------------------------
# Склад (вкладка «Склад»). mode: "auto" — структуры стройки + локации чертежей;
# "custom" — выбранные системы/локации. Остатки вне стройки довозятся (C-J6MT/Jita — тем же
# фрахтом; прочие системы помечаются в отчёте).
# ---------------------------------------------------------------------------
[stock]
mode = "auto"
system_ids = []                    # все локации в этих системах (и новые структуры в них)
location_ids = []                  # отдельные станции/структуры/контейнеры
exclude_location_ids = []          # исключения (и внутри выбранной системы)
character_ids = []                 # чьи ассеты (пусто — всех)
exclude_fitted = true              # модули в слотах фита — не склад
exclude_assembled_ships = false    # собранные корабли (с чем-то внутри) — не склад
exclude_flags = []                 # напр. ["Cargo", "DroneBay", "AssetSafety"]
exclude_type_ids = []              # «запреты»: никогда не брать со склада
exclude_group_ids = []
# keep = [{ type_id = 4247, quantity = 20000 }]   # «не трогать N штук» (запас)

# ---------------------------------------------------------------------------
# Расписание.
# ---------------------------------------------------------------------------
[planner]
account_running_jobs = true        # запущенные джобы занимают слоты до окончания
max_streams_per_node = 64          # потолок потоков одного компонента под срок
compare_max_days = [5.0, 3.0, 2.0, 1.0, 0.5]   # варианты «Сравнить» (0.5 = 12 часов)
# Кому ставить джоб: "any" — любому с самым ранним окончанием (по умолчанию) | "prefer_owner" —
# владельцу чертежа/формулы, если он закончит не позже лучшего на owner_slack_hours |
# "owner_only" — только владельцу (нет его в роли — любому, с предупреждением).
owner_policy = "any"
owner_slack_hours = 24.0
# Копирование T1-чертежа для инвенты (со своего BPO) — отдельными джобами в расписании: по копии
# на каждый джоб инвенты (минимальные раны), инвента ждёт свои копии, один BPO — один джоб за раз.
# false (по умолчанию) — стоимость копий учтена, время копирования в срок не входит.
schedule_copy_jobs = false

# Лимиты слотов Forge по персонажам (вкладка «Персонажи»): сколько слотов расписание может
# занять — manufacturing / reaction / science. -1 (или не задано) — все по скиллам; 0 — персонаж
# в пуле не участвует. Идущие джобы занимают слоты по скиллам: Forge получает min(лимит,
# свободно) — свободно 3 из 11 при лимите 5 → 3 сразу и до 5 по мере окончания идущих.
# [[planner.slot_limits]]
# character_id = 90000001
# manufacturing = 5
# reaction = -1
# science = 2

# ---------------------------------------------------------------------------
# Рекомендации «что строить». Веса метрик и жёсткие фильтры + «запреты».
# ---------------------------------------------------------------------------
[recommend]
w_roi = 1.0
w_isk_hour = 1.0
w_liquidity = 0.5
min_daily_volume = 0       # отсечь неликвид (0 = без фильтра)
max_capital = 0.0          # потолок вложения на партию, ISK (0 = без лимита)
runs = 1
top_per_group = 5
min_cost_ratio = 0.01
winsor_pct = 0.05
buy_cheaper_max_savings_pct = 0.9
buy_cheaper_exclude_categories = [25]   # 25 = Asteroid (руда/лёд — компрессия)
exclude_type_ids = []                   # никогда не рекомендовать
exclude_group_ids = []
exclude_category_ids = []
# Ликвидность («Объём/сут», min_daily_volume, w_liquidity):
# "sell_region" — по записям (по умолчанию): среднее по 30 последним записям истории, без неё —
#   выставленное на продажу в снапшоте (для C-J6MT история не качается, т.е. по сути снапшот);
# "sell_region_history" — реальный оборот региона сбыта по истории ESI (в ней есть и сделки в
#   структурах игроков); включает суточный синк истории региона C-J6MT;
# "jita" — оборот Jita как прокси.
liquidity_source = "sell_region"
liquidity_days = 30        # окно в календарных днях (дни без сделок = 0) — для двух других источников

# [[recommend.groups]]
# name = "Capital ships"
# group_ids = [547, 485, 1538, 883]

# ---------------------------------------------------------------------------
# Значения пульта по умолчанию (на математику не влияют).
# ---------------------------------------------------------------------------
[ui]
default_me = 0
default_te = 0
default_consolidate = true
default_auto_streams = false
recommend_top = 30
buy_cheaper_top = 60
buy_cheaper_min_volume = 50.0
stock_top = 30
# Язык пульта и HTML-отчётов: "ru" или "en" (переключатель RUS/ENG в шапке пульта).
lang = "ru"

# ---------------------------------------------------------------------------
# Автообновление в фоне, пока открыт пульт (или `forge web`).
# ---------------------------------------------------------------------------
[autosync]
enabled = false
character_minutes = 60
market_minutes = 30

# ---------------------------------------------------------------------------
# Станции (facilities) под роли джобов: 'reaction' | 'invention' | 'component' |
# 'manufacturing' | 'copy'. Бонусы ME/времени/стоимости считаются из fitted_type_ids
# (риги, SDE dogma + стэкинг-пенальти) и structure_type_id (встроенный бонус структуры);
# ручные *_bonus_pct — фолбэк без ригов. group_ids/category_ids — какие продукты сюда
# (пусто — все в роли). system_id — система станции: её индекс стоимости джобов и security
# для бонусов ригов; 0 — авто (система структуры location_id, не известна — система стройки).
# Перевозку материалов между системами Forge не считает (всё «доставлено» в систему стройки).
# Удобнее — «Настройки → Станции» в пульте.
# ---------------------------------------------------------------------------
# [[facilities]]
# name = "GPLB-C — Refinery (Composite)"
# role = "reaction"
# group_ids = [429]
# fitted_type_ids = [46486]   # Standup M-Set Composite Reactor Material Efficiency I
# structure_type_id = 35835   # Athanor
# tax_pct = 1.0
# location_id = 0
# system_id = 0               # 0 — авто из location_id

# ---------------------------------------------------------------------------
# Фрахт. mode: "per_m3" (isk_per_m3, min_cost — минимум за заказ) или "fixed_jump"
# (fixed_cost за прыжок, vessel_capacity_m3, load_factor): N партий ⇒ (2N − 1) прыжков.
# Используются плечи jita→c_j6mt, c_j6mt→gplb_c, gplb_c→c_j6mt.
# ---------------------------------------------------------------------------
[[freight_routes]]
from = "jita"
to = "c_j6mt"
mode = "per_m3"
isk_per_m3 = 0.0
min_cost = 0.0

[[freight_routes]]
from = "c_j6mt"
to = "gplb_c"
mode = "fixed_jump"
fixed_cost = 0.0
vessel_capacity_m3 = 0.0
load_factor = 0.0

[[freight_routes]]
from = "gplb_c"
to = "c_j6mt"
mode = "fixed_jump"
fixed_cost = 0.0
vessel_capacity_m3 = 0.0
load_factor = 0.0
