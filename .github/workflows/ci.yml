name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      FORGE_NO_ICON_NET: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,desktop]"
      - name: Ruff
        run: ruff check forge tests tools
      - name: Mypy
        run: mypy forge
      - name: Pytest
        run: python -m pytest -q
